services:
  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      - CORS_ALLOWED_ORIGINS=*
      - MLFLOW_TRACKING_URI=file:./mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
