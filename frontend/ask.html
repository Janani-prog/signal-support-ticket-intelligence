<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Ask a Question - Signal</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/tailwind-config.js"></script>
<link href="shared/styles.css" rel="stylesheet" />
<style>.material-symbols-outlined { font-family: 'Material Symbols Outlined'; }</style>
</head>
<body class="font-body-sm text-body-sm antialiased min-h-screen flex">
<nav class="bg-surface-container-low fixed left-0 top-0 h-screen w-[260px] border-r border-outline-variant flex flex-col py-6 z-50" id="app-nav"></nav>

<div class="flex-1 ml-[260px] flex flex-col min-h-screen">
<header class="bg-background sticky top-0 z-40 w-full border-b border-outline-variant flex justify-between items-center h-16 px-6" id="app-topbar"></header>

<main class="flex-1 p-6 lg:p-8 max-w-[1000px] mx-auto w-full">
<h2 class="font-display-lg text-display-lg text-on-background text-center mb-8" id="ask-heading">What are people saying about checkout this week?</h2>

<div class="relative mb-8">
<input id="ask-input" type="text" placeholder="What are people saying about checkout this week?"
  class="w-full hairline-border bg-surface-container-lowest px-6 py-4 pr-16 font-headline-sm text-headline-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary" />
<button id="ask-submit" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>

<p class="font-data-mono text-data-mono text-on-surface-variant mb-4">Try: <span class="ask-suggestion cursor-pointer underline" data-q="What are people saying about flight delays?">flight delays</span> &middot; <span class="ask-suggestion cursor-pointer underline" data-q="What issues are people having with their iPhone battery?">iPhone battery</span> &middot; <span class="ask-suggestion cursor-pointer underline" data-q="What Wells Fargo or bank account issues are customers reporting?">Wells Fargo</span></p>

<div id="ask-error" class="font-body-sm text-body-sm text-error mb-4"></div>
<div id="ask-result"></div>
</main>
</div>

<script src="shared/api.js"></script>
<script src="shared/nav.js"></script>
<script src="ask.js"></script>
</body>
</html>
